[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "neolabs-greybox-pentest-intern-cli"
version = "0.1.0"
description = "NeoLabs × RIL Grey-Box Pentest internship pod access client"
requires-python = ">=3.10"

[project.scripts]
neolabs = "tools.neolabs:main"

[tool.setuptools]
packages = ["tools"]
